name: Production release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked --bin codex-autoapprover
      - run: python scripts/release_gate.py --require-ready --binary target/release/codex-autoapprover
      # This checks qualification only. Publication/signing must be added after
      # the native matrix, independent review and recovery rehearsal are complete.
