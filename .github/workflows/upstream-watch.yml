name: Watch Codex releases

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      repair_existing:
        description: Retry one bounded repair for an existing unverified candidate after a failed check
        type: boolean
        default: false
      candidate_version:
        description: Exact Codex version to retry when repair_existing is true
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: codex-release-watch
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.watch.outputs.version }}
      changed: ${{ steps.watch.outputs.changed }}
      repair_eligible: ${{ steps.watch.outputs.repair_eligible }}
      candidate_sha: ${{ steps.watch.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_EXISTING: ${{ inputs.repair_existing }}
          CANDIDATE_VERSION_INPUT: ${{ inputs.candidate_version }}
        run: |
          if [ "$REPAIR_EXISTING" = 'true' ]; then
            if ! [[ "$CANDIDATE_VERSION_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'repair_existing requires an exact candidate_version' >&2
              exit 1
            fi
            python scripts/watch_codex.py --create-pr --require-branch --version "$CANDIDATE_VERSION_INPUT"
          else
            python scripts/watch_codex.py --create-pr
          fi

  candidate-preflight:
    needs: detect
    if: ${{ needs.detect.outputs.changed == 'true' || inputs.repair_existing }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CANDIDATE_VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Refresh exact official release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python trusted/scripts/watch_codex.py --version "$env:CANDIDATE_VERSION" --output candidate-runner.json
      - name: Verify native release asset digest
        shell: pwsh
        run: python trusted/scripts/verify_candidate_asset.py "$env:CANDIDATE_VERSION" --candidate candidate-runner.json --recorded-candidate candidate/compatibility/candidate.json
      - name: Lock and install exact npm candidate on disposable runner
        shell: pwsh
        run: |
          if ($env:CANDIDATE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid candidate version' }
          $env:NPM_CONFIG_CACHE = Join-Path $env:RUNNER_TEMP 'candidate-npm-cache'
          $env:NPM_CONFIG_USERCONFIG = Join-Path $env:RUNNER_TEMP 'candidate-empty.npmrc'
          New-Item -ItemType File -Path $env:NPM_CONFIG_USERCONFIG -Force | Out-Null
          New-Item -ItemType Directory -Path candidate-install -Force | Out-Null
          npm install --prefix candidate-install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@openai/codex@$env:CANDIDATE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate lock creation failed' }
          python trusted/scripts/verify_candidate_npm.py "$env:CANDIDATE_VERSION" --candidate candidate-runner.json --recorded-candidate candidate/compatibility/candidate.json --lock candidate-install/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate npm lock differs from official metadata' }
          npm ci --prefix candidate-install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw 'Candidate locked installation failed' }
          npm audit signatures --prefix candidate-install --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw 'Candidate npm registry signatures failed' }
          python trusted/scripts/verify_candidate_npm.py "$env:CANDIDATE_VERSION" --candidate candidate-runner.json --recorded-candidate candidate/compatibility/candidate.json --lock candidate-install/package-lock.json --installed-root candidate-install --output npm-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate installed npm identity differs from its lock' }
      - name: Inspect without credentials or a live approval session
        shell: pwsh
        run: |
          $shim = if ($IsWindows) { 'candidate-install/node_modules/.bin/codex.cmd' } else { 'candidate-install/node_modules/.bin/codex' }
          python trusted/scripts/probe_candidate.py "$env:CANDIDATE_VERSION" --binary $shim
      - name: Summarize candidate evidence
        shell: pwsh
        run: |
          Get-Content asset-verification.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content npm-verification.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content candidate-probe.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'Asset/npm integrity checks and CLI probes do not verify live approvals or Windows sandbox execution.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  candidate-checks:
    needs: [detect, candidate-preflight]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect.outputs.candidate_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - id: format
        run: cargo fmt --check
      - id: rust_tests
        run: cargo test --locked --all-targets
      - id: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Record an actual Rust-check failure
        id: repair_signal
        if: ${{ failure() && (steps.format.outcome == 'failure' || steps.rust_tests.outcome == 'failure' || steps.clippy.outcome == 'failure') }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'candidate-code-failure-${{ matrix.os }}.txt'
          Set-Content -LiteralPath $path -Value 'candidate-code-check-failed' -NoNewline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.repair_signal.outcome == 'success' }}
        with:
          name: codex-code-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/candidate-code-failure-${{ matrix.os }}.txt
          retention-days: 7
          if-no-files-found: error
      - name: State the scope of candidate code checks
        shell: pwsh
        run: '"Synthetic Rust checks do not verify native PermissionRequest behavior." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8'

  repair:
    needs: [detect, candidate-checks]
    if: ${{ always() && needs.detect.result == 'success' && needs.candidate-checks.result == 'failure' && (needs.detect.outputs.repair_eligible == 'true' || inputs.repair_existing) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: codex-code-failure-*
          path: repair-signals
          merge-multiple: true
      - name: Require a failed Rust-check signal before repair setup
        run: |
          shopt -s nullglob
          markers=(repair-signals/candidate-code-failure-*.txt)
          if [ "${#markers[@]}" -lt 1 ]; then echo 'No Rust-check failure signal; repair stopped'; exit 1; fi
          for marker in "${markers[@]}"; do
            case "$(basename "$marker")" in
              candidate-code-failure-ubuntu-24.04.txt|candidate-code-failure-windows-2022.txt) ;;
              *) echo 'Unexpected repair signal name'; exit 1 ;;
            esac
            if [ "$(cat "$marker")" != 'candidate-code-check-failed' ]; then echo 'Invalid repair signal'; exit 1; fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Require an open candidate PR before spending repair authority
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "automation/codex-$CANDIDATE_VERSION" --state open --json number --jq length)
          if [ "$count" != "1" ]; then echo 'No unique open candidate PR; repair stopped'; exit 1; fi
      - name: Install pinned repair CLI without package scripts
        run: npm install --global --ignore-scripts @openai/codex@0.156.0
      - name: Fetch exact upstream source as untrusted read-only context
        env:
          CANDIDATE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if ! [[ "$CANDIDATE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then exit 1; fi
          git clone --quiet --depth=1 --branch "rust-v$CANDIDATE_VERSION" https://github.com/openai/codex.git upstream-source
          chmod -R a-w upstream-source
      - name: Attempt one isolated source repair
        env:
          CODEX_REPAIR_API_KEY: ${{ secrets.CODEX_REPAIR_API_KEY }}
        run: python trusted/scripts/repair_candidate.py --repo candidate --candidate candidate/compatibility/candidate.json --upstream-source upstream-source --output repair-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-repair-${{ needs.detect.outputs.version }}
          path: repair-output/
          retention-days: 7
          if-no-files-found: error

  apply-repair:
    needs: [detect, repair]
    if: ${{ always() && needs.repair.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.commit-repair.outputs.sha }}
    permissions:
      contents: write
      pull-requests: read
    env:
      CANDIDATE_VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: automation/codex-${{ needs.detect.outputs.version }}
          path: candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-repair-${{ needs.detect.outputs.version }}
          path: repair-output
      - name: Require the candidate PR to remain open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "automation/codex-$CANDIDATE_VERSION" --state open --json number --jq length)
          if [ "$count" != "1" ]; then echo 'Candidate PR closed or ambiguous; patch not applied'; exit 1; fi
      - name: Validate and apply the untrusted patch without executing it
        run: python trusted/scripts/apply_repair.py --repo candidate --patch repair-output/repair.patch --report repair-output/repair-report.json --version "$CANDIDATE_VERSION"
      - name: Commit a reviewable repair diff
        id: commit-repair
        run: |
          git -C candidate add -- src tests
          git -C candidate -c core.hooksPath=/dev/null -c user.name=codex-compatibility-bot -c user.email=codex-compatibility-bot@users.noreply.github.com commit -m "Propose bounded Codex $CANDIDATE_VERSION repair"
          git -C candidate -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/automation/codex-$CANDIDATE_VERSION"
          printf 'sha=%s\n' "$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  post-repair-checks:
    needs: [detect, apply-repair]
    if: ${{ always() && needs.apply-repair.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CANDIDATE_VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.apply-repair.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Refresh official release metadata after repair
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python trusted/scripts/watch_codex.py --version "$env:CANDIDATE_VERSION" --output candidate-runner.json
      - name: Verify candidate metadata and native asset after repair
        shell: pwsh
        run: python trusted/scripts/verify_candidate_asset.py "$env:CANDIDATE_VERSION" --candidate candidate-runner.json --recorded-candidate candidate/compatibility/candidate.json
      - name: Lock and install exact npm candidate after repair
        shell: pwsh
        run: |
          if ($env:CANDIDATE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid candidate version' }
          $env:NPM_CONFIG_CACHE = Join-Path $env:RUNNER_TEMP 'candidate-npm-cache'
          $env:NPM_CONFIG_USERCONFIG = Join-Path $env:RUNNER_TEMP 'candidate-empty.npmrc'
          New-Item -ItemType File -Path $env:NPM_CONFIG_USERCONFIG -Force | Out-Null
          New-Item -ItemType Directory -Path candidate-install -Force | Out-Null
          npm install --prefix candidate-install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@openai/codex@$env:CANDIDATE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate lock creation failed' }
          python trusted/scripts/verify_candidate_npm.py "$env:CANDIDATE_VERSION" --candidate candidate-runner.json --recorded-candidate candidate/compatibility/candidate.json --lock candidate-install/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate npm lock differs from official metadata' }
          npm ci --prefix candidate-install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw 'Candidate locked installation failed' }
          npm audit signatures --prefix candidate-install --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw 'Candidate npm registry signatures failed' }
          python trusted/scripts/verify_candidate_npm.py "$env:CANDIDATE_VERSION" --candidate candidate-runner.json --recorded-candidate candidate/compatibility/candidate.json --lock candidate-install/package-lock.json --installed-root candidate-install --output npm-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate installed npm identity differs from its lock' }
      - name: Inspect exact installed candidate without credentials
        shell: pwsh
        run: |
          $shim = if ($IsWindows) { 'candidate-install/node_modules/.bin/codex.cmd' } else { 'candidate-install/node_modules/.bin/codex' }
          python trusted/scripts/probe_candidate.py "$env:CANDIDATE_VERSION" --binary $shim
      - run: cargo fmt --check
        working-directory: candidate
      - run: cargo test --locked --all-targets
        working-directory: candidate
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: candidate
      - name: State remaining qualification
        shell: pwsh
        run: '"Repair checks remain non-live; native PermissionRequest evidence and independent review are still required." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8'
