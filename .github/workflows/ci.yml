name: CI

on:
  push:
    branches: [main, feat/cross-platform-session-binding-v1, feat/auto-compatibility-reconciled, feat/verified-release-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - name: Exercise Linux artifact install lifecycle
        run: ./scripts/test-install-linux.sh target/debug/codex-autoapprover
      - name: Rehearse deterministic Linux development archive
        run: ./scripts/test-package-linux.sh target/debug/codex-autoapprover
      - run: cargo run --locked -- diagnose
      - run: git diff --check

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - name: Test Windows installer in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install-windows.ps1
      - name: Test Windows installer in PowerShell 7
        shell: pwsh
        run: ./scripts/test-install-windows.ps1
      - run: cargo run --locked -- diagnose
      - run: git diff --check

  release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/release_gate.py
      - name: Generate exact Cargo.lock dependency inventory
        run: python scripts/locked_sbom.py --output "$RUNNER_TEMP/codex-autoapprover-locked-dependencies.spdx.json"
      - name: Retain unreviewed dependency inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-dependency-spdx
          path: ${{ runner.temp }}/codex-autoapprover-locked-dependencies.spdx.json
